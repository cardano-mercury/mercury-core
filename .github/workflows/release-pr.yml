name: Release PR

# Keeps a "Release vX.Y.Z" pull request open against main, holding everything on development that has
# not shipped yet.
#
# This is the two-branch model, and it is what makes the changeset accumulator worth having. Pull
# requests target `development`, and each one drops a randomly-named file into `.changeset/`, so two
# open pull requests never touch the same file and never conflict. They pile up on development. This
# workflow then collapses the whole pile, once, into a single version bump and a single CHANGELOG
# section, and offers it as an ordinary pull request into main.
#
# Nothing pushes to main. The release arrives as a PR that runs the same CI as any other, so main
# stays strictly gated and no bot needs permission to bypass branch protection. Merging it is the act
# that makes the release; the tag is what publishes (see release.yml).
#
# It runs only after CI is green on development, so a release can only ever be assembled from a
# commit that passed.
#
# RELEASE_TOKEN, and why it is not optional. A workflow run created with the built-in GITHUB_TOKEN
# cannot trigger further workflow runs: GitHub blocks that to stop a workflow recursing. So a release
# pull request opened with GITHUB_TOKEN gets its checks stuck at `action_required` forever, they
# cannot be approved (that endpoint is only for fork pull requests), and since main requires those
# checks the release can never merge. It is a silent deadlock and it looks like nothing at all.
#
# A personal access token (contents: write, pull-requests: write) makes the push and the pull request
# come from a real identity, so the checks run normally. Without it this workflow still assembles the
# release correctly, but somebody has to push an empty commit to the release branch by hand to wake
# the checks up, and the pull request body says so.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  open:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          # The token the later `git push` inherits. See the note at the top.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Anything to release?
        id: pending
        run: |
          set -euo pipefail
          count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::notice::No changesets on development. Nothing to release."
          fi

      # `changeset version` is the assemble step: it reads every changeset, picks the highest bump,
      # writes package.json and the CHANGELOG section, and deletes the changesets it consumed.
      #
      # The branch is rebuilt from development every time rather than accumulated, so it always
      # reflects development as it is now and never carries a stale bump from a previous run.
      - name: Assemble the release
        if: steps.pending.outputs.count != '0'
        id: assemble
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npx changeset version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git checkout -B "release/v$version"
          git add -A
          git commit -m "Release v$version"
          git push --force origin "release/v$version"

      - name: Open or update the pull request
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.RELEASE_TOKEN != '' }}
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          set -euo pipefail

          # Without a PAT the checks on this PR will sit at action_required forever. Say so in the
          # body rather than letting someone rediscover it.
          # The trailing X is a sentinel, stripped after. Command substitution eats trailing newlines,
          # so without it the warning runs straight into the next sentence.
          warning=""
          if [ "$HAS_PAT" != "true" ]; then
            warning=$(printf '> **The checks on this pull request will not run.** It was opened with the built-in `GITHUB_TOKEN`, and GitHub does not let a run created by that token trigger further runs, so they sit at `action_required` and cannot be approved (that endpoint is only for fork pull requests). Push an empty commit to `release/v%s` to wake them, or add a `RELEASE_TOKEN` secret, a PAT with contents and pull-requests write, and this goes away permanently.\n\nX' "$VERSION")
            warning=${warning%X}
          fi

          # The section this release just wrote, so the PR body says what is actually in it.
          notes=$(awk -v v="$VERSION" '
            $0 ~ "^## " v "$" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md)

          body=$(printf '%sAssembled from the changesets on `development`.' "$warning")
          body=$body$(printf '\n\nMerging this lands the version bump and the changelog on `main`. It does **not** publish: tag it to do that.\n\n```sh\ngit checkout main && git pull\ngit tag "v%s" && git push --tags\n```\n\nThe tag fires `release.yml`, which re-runs the full gate, refuses to publish if the tag and package.json disagree, and publishes to npm with provenance.\n\n---\n%s\n' "$VERSION" "$notes")

          existing=$(gh pr list --base main --head "release/v$VERSION" --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release v$VERSION" --body "$body"
            echo "updated PR #$existing"
          else
            gh pr create --base main --head "release/v$VERSION" \
              --title "Release v$VERSION" --body "$body"
          fi
